# nginx for the showcase presets (sandbox-ai images build-image web --builtin showcase-web), run as user 101 with a
# read-only root: no user directive, the pid and every temporary file in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        server_name localhost;

        # nginx's own page: what the web server serves by itself.
        location = / {
            root /usr/share/nginx/showcase;
            try_files /index.html =404;
        }

        # /app/... goes to the agent's Django (manage.py runserver 127.0.0.1:8000) in the same pod; the agent
        # reaches the web server at localhost:8080, the web server the agent's server at 127.0.0.1:8000.
        location /app/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Prefix /app;
            proxy_set_header X-Forwarded-Proto http;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }
    }
}
