# sandbox-ai's dispatcher configuration for Cairn (docs/CAIRN_REVIEW.md), in the image at /opt/cairn/dispatch.yaml.
# Only Cairn's local execution: its workers are the claude and codex CLIs of this sandbox (the team image), started
# as processes of this sandbox, behind its firewall, connection proxy, approvals and rules. Never Cairn's Docker
# mode: the sandbox has no Docker socket, and a socket would be the host. Copy it to change it:
#   cp /opt/cairn/dispatch.yaml /work/cairn/dispatch.yaml
# Cairn's server is on the sandbox's loopback only (cairn serve's default, 127.0.0.1:8000).

server: "http://127.0.0.1:8000"

runtime:
  execution: local            # workers are processes of this sandbox (never containers of a Docker socket)
  worker_healthcheck: disabled  # local mode: the CLIs are checked on PATH at the start instead
  max_workers: 2              # every worker spends the model's tokens: start small
  max_running_projects: 1
  max_project_workers: 2
  interval: 5
  healthcheck_timeout: 15
  prompt_group: "default"

tasks:
  bootstrap:
    timeout: 300
    conclude_timeout: 60
  reason:
    timeout: 120
  explore:
    timeout: 900
    conclude_timeout: 120

local:
  workspace_root: "/work/cairn/runs"   # one folder per project, kept after it completes
  completed_action: keep

workers:
  - name: "sandbox-claude"
    type: "claudecode"
    task_types: [bootstrap, reason, explore]
    max_running: 1
    priority: 0
  # Codex, when the start has --with codex (its login, its provider's hosts):
  - name: "sandbox-codex"
    type: "codex"
    task_types: [explore]
    max_running: 1
    priority: 1
