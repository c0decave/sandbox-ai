name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04 since 2026-10-19: no Python 3.9 there
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # The suite runs longer than an hour on a runner: each Python version in four parts of the test files.
        shard: [0, 1, 2, 3]
    name: test (${{ matrix.python }}, part ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: ${{ matrix.python }}
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      # Unit, contract, matrix and end-to-end tests; live sandbox tests need --agent-live.
      - name: Tests (failures summarised as an annotation, readable through the API)
        run: |
          # Into a file, not a pipe: a process a test leaves behind would hold the pipe open and the step would hang.
          # In a session of its own (setsid): a signal a test sends to its process group cannot end this step before
          # it says where the run stopped (part runs ended with exit 143 and no word).
          # -v names each test as it starts, so a test that hangs (a part is killed after 60 minutes) is named in the
          # annotation; faulthandler prints the tracebacks of a test that runs longer than 5 minutes.
          files=$(ls tests/test_*.py | awk -v part=${{ matrix.shard }} 'NR % 4 == part')
          # A SIGTERM to this shell itself (3.13 part 0 ended so, exit 143 without a word): say which tests ran last.
          trap 'last=$(grep -E "^tests/.*::" pytest.txt | tail -n 5 | cut -c1-200 | sed ":a;N;\$!ba;s/%/%25/g;s/\n/%0A/g"); echo "::error title=step shell got SIGTERM::last tests:%0A$last"; exit 143' TERM
          timeout --signal=INT --kill-after=60 3600 setsid --wait python -m pytest -v -rfE -o faulthandler_timeout=300 \
            $files > pytest.txt 2>&1 &
          status=0; wait $! || status=$?
          tail -n 300 pytest.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' pytest.txt | head -60 | cut -c1-300)
            # The last tests started, from pytest's progress only (the warnings summary after it names tests too).
            last=$(awk '/^=+ test session starts/ {p = 1; next} p && /^=+ / {exit} p && /^tests\/.*::/' pytest.txt | tail -n 3 | cut -c1-200)
            # Where a test that ran 5 minutes waited, or where the process crashed (faulthandler, every thread).
            # Frames of this repository only (tests, scripts, sandbox), never the idle MCP servers' accept loops.
            dump=$(grep -E -A20000 'Timeout \(|^Fatal Python error' pytest.txt | grep -E 'Timeout|Fatal|no Python frame|File "[^"]*/(tests|scripts|sandbox)/' | grep -v mcp_serve | head -40 | cut -c1-200)
            text=$(printf 'exit %s\n%s\nlast tests:\n%s\n%s' "$status" "$failed" "$last" "$dump" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=pytest failed::$text"
          fi
          exit "$status"

  # The Tor kill switch in the kernel (tests/test_tor_killswitch_live.py): nftables in a network namespace of its own,
  # every way out tried; only --vpn-bypass-tcp's exact address and port may leave past Tor. The run's own kill switch
  # (sandbox-ai net cut, tests/test_killswitch_live.py): the sandbox's firewall with each mode's cut chain, every way
  # out tried; each mode keeps exactly its part, connections open before the cut stop. An MCP server behind a VPN
  # (tests/test_mcp_vpn_live.py): a real WireGuard tunnel between two namespaces with the VPN runtime's own setup;
  # the server's process in the VPN's namespace reaches the internet only with the tunnel's address, its lookups only
  # the VPN's resolver, nothing past the tunnel (LAN, host, IPv6), and nothing at all once the tunnel is down. A
  # start's tunnel lent to its own MCP servers (tests/test_mcp_lent_vpn_live.py): the same real WireGuard tunnel in
  # "the start's pod" with the VPN runtime as its lender, the start's firewall as the launcher writes it, and the
  # runtime as the borrowing VPN container of an image server and of a command server, each in a namespace of its
  # own; a server's traffic leaves with the tunnel's address and by no other way, only the run's token is served, a
  # second sandbox with the key is refused, `sandbox-ai net cut` (the supervisor's own kill switch) ends lent
  # connections that were open and refuses new ones in every mode as it does the agent's, and the borrowers end when
  # the lender is killed. Skipped elsewhere when no namespace with CAP_NET_ADMIN (and WireGuard) can be made; here
  # sudo makes it, and the job fails if it was skipped all the same.
  # What a failed step says (here, in nested and in services: the jobs' logs cannot be read from everywhere, their
  # annotations can): tests/ci_annotations.py prints the failed tests by name (-rfEs), each one's assertion in full
  # (-vv: both sides unshortened) in parts of 4 KB, and the reports the tests keep in $SANDBOX_AI_CI_REPORTS - what
  # each probe saw: its attempts, both ends' routes, connections (conntrack) and counters, the rules loaded, a
  # sandbox's whole output - as warnings and notices. Should the script itself fail, the one line of before.
  killswitch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      # (conntrack: the probes' reports list the lookups' connections - where each went, with which address)
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iproute2 wireguard-tools passt uidmap conntrack
      # The kernel's WireGuard for the MCP VPN test (a namespace makes no module load of its own).
      - run: sudo modprobe wireguard
      - name: Kill switch in the kernel
        shell: bash
        env:
          SANDBOX_AI_CI_REPORTS: ${{ runner.temp }}/ci-reports
        run: |
          status=0
          python -m pytest -vv -rfEs -o faulthandler_timeout=300 tests/test_tor_killswitch_live.py tests/test_killswitch_live.py tests/test_mcp_vpn_live.py tests/test_mcp_lent_vpn_live.py > killswitch.txt 2>&1 || status=$?
          tail -n 200 killswitch.txt
          if [ "$status" -ne 0 ] || grep -q SKIPPED killswitch.txt; then
            # What failed, readable through the API (the logs are not): each failed test, its assertion, the reports.
            python tests/ci_annotations.py "kill switch in the kernel failed" killswitch.txt "$SANDBOX_AI_CI_REPORTS" || {
              text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' killswitch.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=kill switch in the kernel failed::$text"
            }
            exit 1
          fi
      # The Tor container as a start runs it (rootless Podman, its capabilities, its tmpfs): tor comes up, becomes
      # debian-tor and owns its data directory; then a real Tor profile is brought up and checked through Tor.
      # MCP servers behind a VPN with real containers (tests/test_mcp_vpn_podman_live.py): each connection's container
      # is created only in a VPN container with its kill switch, in exactly its namespace, and reaches nothing; a
      # command server's pod shares the VPN's namespace; through a real Tor profile (the image server's wrapper and
      # guard end to end) the server reaches only Tor, and the end of the VPN container stops it.
      - name: Tor container under Podman
        shell: bash
        env:
          SANDBOX_AI_BUILD_TOR: "1"
          SANDBOX_AI_LIVE_NETWORK: "1"
          SANDBOX_AI_CI_REPORTS: ${{ runner.temp }}/ci-reports-tor
        run: |
          podman --version
          status=0
          python -m pytest -vv -rfEs -o faulthandler_timeout=300 tests/test_tor_container_live.py tests/test_mcp_vpn_podman_live.py > tor.txt 2>&1 || status=$?
          tail -n 200 tor.txt
          if [ "$status" -ne 0 ] || grep -q SKIPPED tor.txt; then
            # What failed, readable through the API (the logs are not): each failed test, its assertion, the reports.
            python tests/ci_annotations.py "Tor container failed" tor.txt "$SANDBOX_AI_CI_REPORTS" || {
              text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' tor.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=Tor container failed::$text"
            }
            exit 1
          fi

  # --nested-containers in a real sandbox (tests/test_nested_containers_live.py): Podman inside the agent's sandbox
  # runs a container and unshare -rn works, while what the containers send meets the sandbox's own firewall and
  # connection proxy (a refused destination stays refused, and the proxy logs it). Builds the claude image and its dev
  # variant first; the job fails if the test was skipped all the same - except for the one skip the test names a
  # "known limitation of this runner" (crun may not mount mqueue here although the agent has an IPC namespace of its
  # own): a warning then (that runner cannot run containers inside the sandbox).
  nested:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman passt slirp4netns uidmap
      # Ubuntu's AppArmor takes the capabilities of a user namespace an unconfined program makes (the supervisor
      # makes the agent's); a host that runs sandboxes with --nested-containers needs the same.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The claude image and its dev variant
        run: |
          podman --version
          ./sandbox-ai images recipe dev --from claude
          ./sandbox-ai build dev
      - name: Podman inside a sandbox
        shell: bash
        env:
          SANDBOX_AI_CI_REPORTS: ${{ runner.temp }}/ci-reports
        run: |
          status=0
          python -m pytest -vv -rfEs -o faulthandler_timeout=300 --agent-live tests/test_nested_containers_live.py > nested.txt 2>&1 || status=$?
          tail -n 200 nested.txt
          if [ "$status" -eq 0 ] && grep -q SKIPPED nested.txt && ! grep -E '^SKIPPED' nested.txt | grep -qv 'known limitation of this runner'; then
            text=$(grep -E '^SKIPPED' nested.txt | head -5 | cut -c1-900 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::warning title=nested containers: known limitation of this runner::$text"
            exit 0
          fi
          if [ "$status" -ne 0 ] || grep -q SKIPPED nested.txt; then
            # What failed, readable through the API (the logs are not): the test's assertion in full - the results,
            # the end of the sandbox's standard error - and its report: everything the sandbox printed.
            python tests/ci_annotations.py "nested containers failed" nested.txt "$SANDBOX_AI_CI_REPORTS" || {
              text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' nested.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=nested containers failed::$text"
            }
            exit 1
          fi

  # Your own images in real sandboxes (tests/test_services_live.py): redis from Docker Hub, pulled and pinned by
  # digest, as a service beside the agent (the agent reaches it at localhost; from inside its container a destination
  # outside the allow-list stays unreached and lands in the proxy's log; no capabilities, read-only root), and a
  # variant of claude on python:3.12-slim-bookworm; the preset showcase-full-stack's services (PostgreSQL 17.6, nginx from
  # sandbox-ai's own Containerfile, images build-image --builtin showcase-web) and its image recipe django built and
  # used against them. Builds the claude image first; the job fails if a test was skipped (the recipe android-dev's
  # opt-in build of about 4.1 GB is deselected).
  services:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman passt slirp4netns uidmap
      - name: Host settings (user namespaces, NAT modules, a systemd user session for the limits)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe -a nft_chain_nat nft_redir || true
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The claude image
        run: |
          podman --version
          ./sandbox-ai build claude
      - name: Services and a base image of your own
        shell: bash
        env:
          SANDBOX_AI_CI_REPORTS: ${{ runner.temp }}/ci-reports
        run: |
          status=0
          # The recipe android-dev's real build (about 4.1 GB) is opt-in (SANDBOX_AI_ANDROID_DEV_BUILD=1) and not run
          # here: deselected by name, so that any other skip still fails the job.
          python -m pytest -vv -rfEs -o faulthandler_timeout=600 --agent-live tests/test_services_live.py \
            --deselect tests/test_services_live.py::test_the_android_dev_recipe_builds_and_has_its_tools \
            > services.txt 2>&1 || status=$?
          tail -n 200 services.txt
          if [ "$status" -ne 0 ] || grep -q SKIPPED services.txt; then
            # What failed, readable through the API (the logs are not): each failed test, its assertion, and the
            # reports - each start's whole output, and what a start said whose service's container never ran.
            python tests/ci_annotations.py "services failed" services.txt "$SANDBOX_AI_CI_REPORTS" || {
              text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' services.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
              echo "::error title=services failed::$text"
            }
            exit 1
          fi

  # The sandbox's own browser in real sandboxes (tests/test_browser_live.py): sandbox-ai build browser (its Debian base
  # pinned by digest), a start with --browser for the human (its container without capabilities and port, RFB on the
  # Unix socket of its run, no DevTools and no abstract X socket for the agent) and one the agent drives (DevTools at
  # 127.0.0.1:9222, its pages through the connection proxy). Builds the claude image first; fails if a test was skipped.
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman passt slirp4netns uidmap
      - name: Host settings (user namespaces, NAT modules, a systemd user session for the limits)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe -a nft_chain_nat nft_redir || true
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The claude and browser images
        run: |
          podman --version
          ./sandbox-ai build claude
          ./sandbox-ai build browser
      - name: The sandbox's own browser
        shell: bash
        run: |
          status=0
          python -m pytest -v -rs -o faulthandler_timeout=600 --agent-live tests/test_browser_live.py > browser.txt 2>&1 || status=$?
          tail -n 200 browser.txt
          if [ "$status" -ne 0 ] || grep -q SKIPPED browser.txt; then
            text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' browser.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=browser failed::$text"
            exit 1
          fi

  # The agents and parts with a live test of their own, one job each, in parallel (tests/test_<name>_live.py, what they share:
  # tests/live_agents.py): each agent in a real sandbox of its image against a scripted model server on the runner's
  # loopback (tests/devtools/agent_model.py with --llm: no provider, no key), one prompt answered, one tool of
  # sandbox-ai's demo MCP server called through the bridge (it runs in the codex image), no telemetry host reached
  # (the run's logs; the refused hosts listed in the job's summary), each --AGENT-enable switch opening exactly its
  # hosts; Cairn: its server on the sandbox's loopback and one task of its dispatcher in local mode. The same as
  # scripts/live_check_agents.sh on a machine of yours. Fails if a test was skipped.
  agents-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: hermes, builds: "codex hermes", suite: tests/test_hermes_live.py}
          - {name: qwen, builds: "codex qwen", suite: tests/test_qwen_live.py}
          - {name: dsh, builds: "codex dsh", suite: tests/test_dsh_live.py}
          - {name: goose, builds: "codex goose", suite: tests/test_goose_live.py}
          - {name: openhands, builds: "codex openhands", suite: tests/test_openhands_live.py}
          - {name: nanobot, builds: "codex nanobot", suite: tests/test_nanobot_live.py}
          - {name: letta, builds: "codex letta", suite: tests/test_letta_live.py}
          - {name: opencode2, builds: "codex opencode2", suite: tests/test_opencode2_live.py}
          - {name: pi, builds: "codex pi", suite: tests/test_pi_live.py}
          - {name: cairn, builds: "claude cairn browser", suite: tests/test_cairn_live.py}
    name: agents-live (${{ matrix.name }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman passt slirp4netns uidmap
      - name: Host settings (user namespaces, NAT modules, a systemd user session for the limits)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo modprobe -a nft_chain_nat nft_redir || true
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 30); do [ -S "/run/user/$(id -u)/bus" ] && break; sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: The images (${{ matrix.builds }})
        run: |
          podman --version
          for target in ${{ matrix.builds }}; do ./sandbox-ai build "$target"; done
      - name: The live checks of ${{ matrix.name }}
        shell: bash
        env:
          SANDBOX_AI_LIVE_REPORT_DIR: ${{ runner.temp }}/live-report
        run: |
          status=0
          python -m pytest -v -rs -o faulthandler_timeout=900 --agent-live ${{ matrix.suite }} > live.txt 2>&1 || status=$?
          tail -n 200 live.txt
          {
            echo "### What ${{ matrix.name }} reached"
            for f in "$SANDBOX_AI_LIVE_REPORT_DIR"/*.json; do
              [ -f "$f" ] || continue
              echo "- $(basename "$f" .json): \`$(tr -d '\n' < "$f" | cut -c1-1500)\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ] || grep -q SKIPPED live.txt; then
            text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' live.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=agents-live ${{ matrix.name }} failed::$text"
            exit 1
          fi

  package:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04 since 2026-10-19: no Python 3.9 there
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: python scripts/make_dist.py --no-isolation
      - name: Install the wheel and run every command
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          for c in "sandbox-ai --version" "sandbox-ai build --help" "sandbox-ai wizard --help" "sandbox-ai mcp --help"; do
            /tmp/venv/bin/$c >/dev/null
          done
          # the app without the extra [gui]: no PySide6, so it says how to add it (and ends with 1)
          if /tmp/venv/bin/sandbox-ai-app --self-test 2>/tmp/app-no-gui.txt; then exit 1; fi
          grep -F "'sandbox-ai-app[gui]'" /tmp/app-no-gui.txt
      - name: sandbox-ai.pyz (the release workflow checks it and the app packages in full)
        run: scripts/e2e_package.sh pyz dist/sandbox-ai.pyz --python python
      - name: The package build scripts parse
        run: bash -n scripts/build_appimage.sh scripts/build_macos_app.sh scripts/e2e_package.sh

  # The host side on a real Mac (TODO.md: macOS support): the macOS tests against the real kernel (sysctl, F_GETPATH,
  # LOCAL_PEERPID; the Linux suite simulates them) and install.sh with the Mac's bash 3.2 and BSD tools. No Podman
  # here: podman machine needs nested virtualisation, which GitHub's macOS runners do not have.
  macos:
    runs-on: macos-15  # arm64 (macos-14 is retired: "configuration not supported")
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - name: Tests of the host side (macOS)
        run: |
          status=0; python -X faulthandler -m pytest -v -rfE -o faulthandler_timeout=300 \
            tests/test_macos_host.py tests/test_macos_integration.py tests/test_doctor_macos.py \
            tests/test_secret_store.py tests/test_textout.py tests/test_codenames.py > pytest.txt 2>&1 || status=$?
          tail -n 300 pytest.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' pytest.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=macOS tests failed::exit $status%0A$failed"
          fi
          exit "$status"
      - name: install.sh from this checkout into a scratch HOME, then its commands
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          /bin/bash install.sh --from . --user --no-app-deps --no-app-terminal
          "$HOME/.local/bin/sandbox-ai" --version
          test ! -e "$HOME/.local/bin/claude-sandbox"  # the old single commands are gone (0.1.92)
          grep -q "sandbox-ai" "$HOME/.zshrc"

  # The desktop app (projects/sandbox-ai-app), tested against the sandbox-ai of the same commit.
  app:
    runs-on: ubuntu-24.04  # the apt names below (libasound2t64, ...) are 24.04's
    # The suite outgrew one runner: 3379 tests at 0.1.96 took 45-70 minutes (2700 s ran out, 4200 s did not), 5892 at
    # 0.1.187 ran into 4200 s at its last files. Four parts of the test files, as the core tests' job splits.
    strategy:
      fail-fast: false
      matrix:
        part: [0, 1, 2, 3]
    name: app (part ${{ matrix.part }})
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      # A test skipped for missing Qt, QtWebEngine or sandbox-ai fails instead (tests/conftest.py).
      SANDBOX_AI_APP_REQUIRE_QT: "1"
      # Chromium's own sandbox needs user namespaces and the runner has no GPU: off for the tests only.
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      SANDBOX_AI_HOME: ${{ github.workspace }}
    defaults:
      run:
        working-directory: projects/sandbox-ai-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - name: System libraries for Qt and QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 \
            libdrm2 libxkbfile1 libxcb-cursor0 fonts-dejavu-core gdb \
            xvfb x11vnc x11-utils  # the browser tab's live tests: a real display, its VNC server and xev
      - name: Install PySide6 (with Addons and WebEngine) and pytest
        working-directory: .
        run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-app-test.txt -r packaging/requirements-ci.txt"
      - name: Vendor xterm.js
        run: python scripts/vendor_xterm.py
      - name: Tests (offscreen, Qt required)
        run: |
          # Into a file, not a pipe (see above); a crash (exit 139) names the test it happened in.
          # faulthandler_timeout: a test that runs longer than 5 minutes prints every thread's stack (where it waits),
          # as the core job's tests do; the annotation below carries those frames.
          files=$(ls tests/test_*.py | awk -v part=${{ matrix.part }} 'NR % 4 == part')
          status=0; timeout --signal=INT --kill-after=60 2700 python -X faulthandler -m pytest -v -rs -rfE \
            -o faulthandler_timeout=300 $files > tests.txt 2>&1 || status=$?
          tail -n 300 tests.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' tests.txt | head -60 | cut -c1-300)
            # The last tests started, from pytest's progress only: the warnings summary after it names tests too
            # (0.1.187's "last tests" were one earlier test's three warnings, the run was at its last files).
            last=$(awk '/^=+ test session starts/ {p = 1; next} p && /^=+ / {exit} p && /^tests\/.*::/' tests.txt | tail -n 3 | cut -c1-200)
            if [ "$status" -eq 124 ]; then last=$(printf '%s\n(this part ran into its timeout of 2700 s)' "$last"); fi
            # The whole faulthandler dump, every thread: a crash in a thread of Qt's own shows "<no Python frame>".
            crash=$(grep -E -A120 '^Fatal Python error' tests.txt | grep -E 'Fatal|[Tt]hread|File "|no Python frame|Extension' | head -60 | cut -c1-200)
            # A test that waited 5 minutes (faulthandler_timeout): its threads' frames of the app and of the tests.
            hung=$(grep -E -A20000 '^Timeout \(' tests.txt | grep -E 'Timeout|[Tt]hread|File "[^"]*/(tests|sandbox_ai_app|sandbox)/' | head -60 | cut -c1-200)
            text=$(printf 'exit %s\n%s\nlast tests:\n%s\n%s\n%s' "$status" "$failed" "$last" "$crash" "$hung" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=app tests failed (part ${{ matrix.part }})::$text"
          fi
          exit "$status"
      - name: The board's drop tests, repeated under gdb (a native crash shows its backtrace)
        if: matrix.part == 0
        run: |
          # It crashed now and then on these runners before 0.1.90 (TODO.md, "The app"): 15 runs of the file, each
          # under gdb, which prints every thread's native stack when the process gets a fatal signal.
          for run in $(seq 1 15); do
            gdb -q -batch -ex "handle SIGPIPE nostop noprint" -ex run -ex "thread apply all bt 40" \
              --args python -X faulthandler -m pytest -q -p no:cacheprovider tests/test_board_dnd.py > gdb.txt 2>&1 || true
            if grep -qE "received signal (SIGSEGV|SIGABRT|SIGBUS|SIGILL|SIGTRAP)" gdb.txt; then
              grep -E -A200 "received signal" gdb.txt | head -300
              echo "::error title=board drop tests crashed (run $run)::see the backtrace in the log"
              exit 1
            fi
            grep -qE "[0-9]+ passed" gdb.txt && ! grep -qE "[0-9]+ (failed|error)" gdb.txt || { tail -n 80 gdb.txt; exit 1; }
          done
      - name: No Qt test was skipped
        run: |
          if grep -E "SKIPPED.*(PySide6|QtWebEngine|QtCore|QtWidgets|SANDBOX_AI_HOME)" tests.txt; then
            echo "::error::Qt tests were skipped"
            exit 1
          fi

  # Remote systems in the Files page against a real OpenSSH server (tests/test_files_remote_sshd.py): the test starts
  # sshd itself as the runner's own user (a free port on 127.0.0.1, a host key and a user key of its own, key login only,
  # the built-in SFTP), connects as the page does - the unknown host refused, its fingerprint read with ssh-keyscan and
  # compared, then trusted - and copies both ways, writes and deletes, directly and through the page; remote.py also
  # against OpenSSH's own sftp-server (tests/test_remote.py). Not as root (a root sshd needs its privilege separation
  # user and chroot); the job fails if a test was skipped all the same.
  files-remote:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      SANDBOX_AI_HOME: ${{ github.workspace }}
    defaults:
      run:
        working-directory: projects/sandbox-ai-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - name: OpenSSH (server, sftp-server, client) and the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends openssh-server openssh-sftp-server openssh-client \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 \
            libdrm2 libxkbfile1 libxcb-cursor0 fonts-dejavu-core
      - name: Install PySide6 and pytest
        working-directory: .
        run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-app-test.txt -r packaging/requirements-ci.txt"
      - name: Remote systems against a real sshd (not as root)
        shell: bash
        run: |
          if [ "$(id -u)" -eq 0 ]; then echo "::error title=remote file manager::runs as root"; exit 1; fi
          status=0
          python -m pytest -v -rs -o faulthandler_timeout=300 tests/test_files_remote_sshd.py \
            "tests/test_remote.py::test_against_openssh_sftp_server" > remote.txt 2>&1 || status=$?
          tail -n 200 remote.txt
          if [ "$status" -ne 0 ] || grep -q SKIPPED remote.txt; then
            # What failed, readable through the API (the logs are not): FAILED/SKIPPED lines and assertion messages.
            text=$(grep -E '^(FAILED|ERROR|SKIPPED)|^E ' remote.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=remote file manager against sshd failed::$text"
            exit 1
          fi
