name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04 since 2026-10-19: no Python 3.9 there
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        # The suite runs longer than an hour on a runner: each Python version in three parts of the test files.
        shard: [0, 1, 2]
    name: test (${{ matrix.python }}, part ${{ matrix.shard }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: ${{ matrix.python }}
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      # Unit, contract, matrix and end-to-end tests; live sandbox tests need --agent-live.
      - name: Tests (failures summarised as an annotation, readable through the API)
        run: |
          # Into a file, not a pipe: a process a test leaves behind would hold the pipe open and the step would hang.
          # -v names each test as it starts, so a test that hangs (a part is killed after 60 minutes) is named in the
          # annotation; faulthandler prints the tracebacks of a test that runs longer than 5 minutes.
          files=$(ls tests/test_*.py | awk -v part=${{ matrix.shard }} 'NR % 3 == part')
          status=0; timeout --signal=INT --kill-after=60 3600 python -m pytest -v -rfE -o faulthandler_timeout=300 \
            $files > pytest.txt 2>&1 || status=$?
          tail -n 300 pytest.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' pytest.txt | head -60 | cut -c1-300)
            last=$(grep -E '^tests/.*::' pytest.txt | tail -n 3 | cut -c1-200)
            # Where a test that ran 5 minutes waited, or where the process crashed (faulthandler, every thread).
            # Frames of this repository only (tests, scripts, sandbox), never the idle MCP servers' accept loops.
            dump=$(grep -E -A20000 'Timeout \(|^Fatal Python error' pytest.txt | grep -E 'Timeout|Fatal|no Python frame|File "[^"]*/(tests|scripts|sandbox)/' | grep -v mcp_serve | head -40 | cut -c1-200)
            text=$(printf 'exit %s\n%s\nlast tests:\n%s\n%s' "$status" "$failed" "$last" "$dump" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=pytest failed::$text"
          fi
          exit "$status"

  # The Tor kill switch in the kernel (tests/test_tor_killswitch_live.py): nftables in a network namespace of its own,
  # every way out tried; only --vpn-bypass-tcp's exact address and port may leave past Tor. The run's own kill switch
  # (sandbox-ai net cut, tests/test_killswitch_live.py): the sandbox's firewall with each mode's cut chain, every way
  # out tried; each mode keeps exactly its part, connections open before the cut stop. Skipped elsewhere when no
  # namespace with CAP_NET_ADMIN can be made; here sudo makes it, and the job fails if it was skipped all the same.
  killswitch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nftables iproute2
      - name: Kill switch in the kernel
        shell: bash  # with pipefail: pytest's status survives the tee
        run: |
          python -m pytest -v -rs tests/test_tor_killswitch_live.py tests/test_killswitch_live.py | tee killswitch.txt
          ! grep -q SKIPPED killswitch.txt
      # The Tor container as a start runs it (rootless Podman, its capabilities, its tmpfs): tor comes up, becomes
      # debian-tor and owns its data directory; then a real Tor profile is brought up and checked through Tor.
      - name: Tor container under Podman
        shell: bash
        env:
          SANDBOX_AI_BUILD_TOR: "1"
          SANDBOX_AI_LIVE_NETWORK: "1"
        run: |
          podman --version
          python -m pytest -v -rs tests/test_tor_container_live.py | tee tor.txt
          ! grep -q SKIPPED tor.txt

  # --nested-containers in a real sandbox (tests/test_nested_containers_live.py): Podman inside the agent's sandbox
  # runs a container and unshare -rn works, while what the containers send meets the sandbox's own firewall and
  # connection proxy (a refused destination stays refused, and the proxy logs it). Builds the claude image and its dev
  # variant first; the job fails if the test was skipped all the same.
  nested:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends podman passt slirp4netns uidmap
      # Ubuntu's AppArmor takes the capabilities of a user namespace an unconfined program makes (the supervisor
      # makes the agent's); a host that runs sandboxes with --nested-containers needs the same.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: The claude image and its dev variant
        run: |
          podman --version
          ./sandbox-ai images recipe dev --from claude
          ./sandbox-ai build dev
      - name: Podman inside a sandbox
        shell: bash
        run: |
          python -m pytest -v -rs --agent-live tests/test_nested_containers_live.py | tee nested.txt
          ! grep -q SKIPPED nested.txt

  package:
    runs-on: ubuntu-24.04  # ubuntu-latest is 26.04 since 2026-10-19: no Python 3.9 there
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - run: python scripts/make_dist.py --no-isolation
      - name: Install the wheel and run every command
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          for c in "sandbox-ai --version" "sandbox-ai build --help" "sandbox-ai wizard --help" "sandbox-ai mcp --help"; do
            /tmp/venv/bin/$c >/dev/null
          done
      - name: sandbox-ai.pyz (the release workflow checks it and the app packages in full)
        run: scripts/e2e_package.sh pyz dist/sandbox-ai.pyz --python python
      - name: The package build scripts parse
        run: bash -n scripts/build_appimage.sh scripts/build_macos_app.sh scripts/e2e_package.sh

  # The host side on a real Mac (TODO.md: macOS support): the macOS tests against the real kernel (sysctl, F_GETPATH,
  # LOCAL_PEERPID; the Linux suite simulates them) and install.sh with the Mac's bash 3.2 and BSD tools. No Podman
  # here: podman machine needs nested virtualisation, which GitHub's macOS runners do not have.
  macos:
    runs-on: macos-15  # arm64 (macos-14 is retired: "configuration not supported")
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - name: Tests of the host side (macOS)
        run: |
          status=0; python -X faulthandler -m pytest -v -rfE -o faulthandler_timeout=300 \
            tests/test_macos_host.py tests/test_macos_integration.py tests/test_doctor_macos.py \
            tests/test_secret_store.py tests/test_textout.py tests/test_codenames.py > pytest.txt 2>&1 || status=$?
          tail -n 300 pytest.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' pytest.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=macOS tests failed::exit $status%0A$failed"
          fi
          exit "$status"
      - name: install.sh from this checkout into a scratch HOME, then its commands
        run: |
          export HOME="$RUNNER_TEMP/home"
          mkdir -p "$HOME"
          /bin/bash install.sh --from . --user --no-app-deps --no-app-terminal
          "$HOME/.local/bin/sandbox-ai" --version
          test ! -e "$HOME/.local/bin/claude-sandbox"  # the old single commands are gone (0.1.92)
          grep -q "sandbox-ai" "$HOME/.zshrc"

  # The desktop app (projects/sandbox-ai-app), tested against the sandbox-ai of the same commit.
  app:
    runs-on: ubuntu-24.04  # the apt names below (libasound2t64, ...) are 24.04's
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      # A test skipped for missing Qt, QtWebEngine or sandbox-ai fails instead (tests/conftest.py).
      SANDBOX_AI_APP_REQUIRE_QT: "1"
      # Chromium's own sandbox needs user namespaces and the runner has no GPU: off for the tests only.
      QTWEBENGINE_CHROMIUM_FLAGS: "--no-sandbox --disable-gpu"
      QTWEBENGINE_DISABLE_SANDBOX: "1"
      SANDBOX_AI_HOME: ${{ github.workspace }}
    defaults:
      run:
        working-directory: projects/sandbox-ai-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - name: System libraries for Qt and QtWebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libnss3 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libxshmfence1 libgbm1 \
            libdrm2 libxkbfile1 libxcb-cursor0 fonts-dejavu-core gdb
      - name: Install PySide6 (with Addons and WebEngine) and pytest
        working-directory: .
        run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-app-test.txt -r packaging/requirements-ci.txt"
      - name: Vendor xterm.js
        run: python scripts/vendor_xterm.py
      - name: Tests (offscreen, Qt required)
        run: |
          # Into a file, not a pipe (see above); a crash (exit 139) names the test it happened in.
          status=0; timeout --signal=INT --kill-after=60 1500 python -X faulthandler -m pytest -v -rs -rfE tests \
            > tests.txt 2>&1 || status=$?
          tail -n 300 tests.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' tests.txt | head -60 | cut -c1-300)
            last=$(grep -E '^tests/.*::' tests.txt | tail -n 3 | cut -c1-200)
            # The whole faulthandler dump, every thread: a crash in a thread of Qt's own shows "<no Python frame>".
            crash=$(grep -E -A120 '^Fatal Python error' tests.txt | grep -E 'Fatal|[Tt]hread|File "|no Python frame|Extension' | head -60 | cut -c1-200)
            text=$(printf 'exit %s\n%s\nlast tests:\n%s\n%s' "$status" "$failed" "$last" "$crash" | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=app tests failed::$text"
          fi
          exit "$status"
      - name: The board's drop tests, repeated under gdb (a native crash shows its backtrace)
        run: |
          # It crashed now and then on these runners before 0.1.90 (TODO.md, "The app"): 15 runs of the file, each
          # under gdb, which prints every thread's native stack when the process gets a fatal signal.
          for run in $(seq 1 15); do
            gdb -q -batch -ex "handle SIGPIPE nostop noprint" -ex run -ex "thread apply all bt 40" \
              --args python -X faulthandler -m pytest -q -p no:cacheprovider tests/test_board_dnd.py > gdb.txt 2>&1 || true
            if grep -qE "received signal (SIGSEGV|SIGABRT|SIGBUS|SIGILL|SIGTRAP)" gdb.txt; then
              grep -E -A200 "received signal" gdb.txt | head -300
              echo "::error title=board drop tests crashed (run $run)::see the backtrace in the log"
              exit 1
            fi
            grep -qE "[0-9]+ passed" gdb.txt && ! grep -qE "[0-9]+ (failed|error)" gdb.txt || { tail -n 80 gdb.txt; exit 1; }
          done
      - name: No Qt test was skipped
        run: |
          if grep -E "SKIPPED.*(PySide6|QtWebEngine|QtCore|QtWidgets|SANDBOX_AI_HOME)" tests.txt; then
            echo "::error::Qt tests were skipped"
            exit 1
          fi
