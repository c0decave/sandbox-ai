# Runs for a pushed tag vX.Y.Z: tests, builds dist/ (bundle, sandbox-ai.pyz, PyPI package, install.sh), the
# AppImages (x86_64, aarch64) and the macOS disk images (arm64, x86_64), checks each package end to end, then
# publishes the release with SHA256SUMS over all files and, on github.com, the PyPI package.
# Gitea/Forgejo Actions run it too: there the release is created with scripts/publish_release.py
# and the secret RELEASE_TOKEN; the PyPI job is skipped (and the macOS jobs need macOS runners).
# Signed releases: once sandbox/release-signers lists a key, installations refuse releases without a
# good SHA256SUMS.sig. The signing key never comes near CI, so this workflow then publishes no release
# files; the maintainer downloads the packages built here, signs and uploads (RELEASING.md, "Signed releases").
#
# Every action is pinned by its full commit SHA, each at least 14 days old when pinned (the date stands beside
# it); every download of the package builds is pinned by SHA-256 (packaging/). tests/test_dist_packaging.py
# checks both.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:  # builds and checks every package; publishes nothing (only a pushed tag does)

permissions:
  contents: read

# The app (projects/sandbox-ai-app) is part of this repository; the bundle and the packages take it from the checkout.

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: "3.12"
      - run: "python -m pip install --require-hashes --only-binary :all: -r packaging/requirements-ci.txt"
      - name: Tests (failures summarised as an annotation, readable through the API)
        run: |
          # Into a file, not a pipe: a process a test leaves behind would hold the pipe open and the step would hang.
          status=0; python -m pytest -q -rfE tests > pytest.txt 2>&1 || status=$?
          tail -n 300 pytest.txt
          if [ "$status" -ne 0 ]; then
            failed=$(grep -E '^(FAILED|ERROR) ' pytest.txt | head -60 | cut -c1-300 | sed ':a;N;$!ba;s/%/%25/g;s/\n/%0A/g')
            echo "::error title=pytest failed::${failed:-no summary line; see the log}"
          fi
          exit "$status"
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' sandbox/agent_sandbox.py)
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - name: Build dist/
        run: |
          python scripts/make_dist.py --no-isolation
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, published 2026-10-07
        with:
          name: dist
          path: dist/

  # sandbox-ai.pyz is built by make_dist.py in "build" (it lands in dist/ with the bundle it is made of); here it
  # runs on the oldest and the newest Python it supports.
  e2e-pyz:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0, published 2026-10-22
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/e2e_package.sh pyz dist/sandbox-ai.pyz --python python
      - name: Started as ./sandbox-ai.pyz (its #!/bin/sh line runs python3 -I)
        run: |
          chmod +x dist/sandbox-ai.pyz
          XDG_CACHE_HOME="$RUNNER_TEMP/cache" ./dist/sandbox-ai.pyz --version

  build-appimage:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: dist
          path: dist/
      - name: Build (the end of its output as an annotation when it fails, readable through the API)
        env:
          GITHUB_TOKEN: ${{ github.token }}  # only the API's rate limit, when a download falls back to it
        run: |
          status=0; scripts/build_appimage.sh --bundle dist/sandbox-ai-bundle-*.tar.gz --out packages > build.log 2>&1 || status=$?
          tail -n 200 build.log
          if [ "$status" -ne 0 ]; then
            # Python, not sed: macOS's sed has no :a;N;$!ba (the annotation kept one line only).
            text=$(tail -n 25 build.log | cut -c1-200 | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))')
            echo "::error title=build_appimage.sh failed::exit $status%0A$text"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, published 2026-10-07
        with:
          name: appimage-${{ matrix.arch }}
          path: packages/sandbox-ai-${{ matrix.arch }}.AppImage
          if-no-files-found: error

  # The AppImage on the runner (with FUSE) and in older distributions (docker, without FUSE). PySide6's aarch64
  # wheels need glibc 2.39: on an older aarch64 system only the command line runs.
  e2e-appimage:
    needs: build-appimage
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x86_64, image: ""}
          - {runner: ubuntu-24.04, arch: x86_64, image: "ubuntu:22.04"}
          - {runner: ubuntu-24.04, arch: x86_64, image: "debian:12"}
          - {runner: ubuntu-24.04-arm, arch: aarch64, image: ""}
          - {runner: ubuntu-24.04-arm, arch: aarch64, image: "debian:12", only: "--cli-only"}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: appimage-${{ matrix.arch }}
          path: packages/
      - name: On the runner
        if: matrix.image == ''
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fuse3 libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3
          chmod +x packages/*.AppImage
          scripts/e2e_package.sh appimage packages/sandbox-ai-${{ matrix.arch }}.AppImage
      - name: In ${{ matrix.image }}
        if: matrix.image != ''
        run: |
          chmod +x packages/*.AppImage
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" bash -euc '
            apt-get update -q >/dev/null
            apt-get install -y -q --no-install-recommends ca-certificates libegl1 libgl1 libopengl0 libxkbcommon0 \
              libfontconfig1 libglib2.0-0 libdbus-1-3 >/dev/null
            useradd -m tester
            su tester -c "/src/scripts/e2e_package.sh appimage /src/packages/sandbox-ai-${{ matrix.arch }}.AppImage --extract-and-run ${{ matrix.only }}"'

  build-macos:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          # macos-13 is retired; macos-15-intel is GitHub's last Intel image.
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: dist
          path: dist/
      - name: Build (the end of its output as an annotation when it fails, readable through the API)
        env:
          GITHUB_TOKEN: ${{ github.token }}  # only the API's rate limit, when a download falls back to it
        run: |
          status=0; scripts/build_macos_app.sh --bundle dist/sandbox-ai-bundle-*.tar.gz --out packages > build.log 2>&1 || status=$?
          tail -n 200 build.log
          if [ "$status" -ne 0 ]; then
            # Python, not sed: macOS's sed has no :a;N;$!ba (the annotation kept one line only).
            text=$(tail -n 25 build.log | cut -c1-200 | python3 -c 'import sys; print(sys.stdin.read().replace("%", "%25").replace("\n", "%0A"))')
            echo "::error title=build_macos_app.sh failed::exit $status%0A$text"
          fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2, published 2026-10-07
        with:
          name: macos-${{ matrix.arch }}
          path: packages/sandbox-ai-${{ matrix.arch }}.dmg
          if-no-files-found: error

  e2e-macos:
    needs: build-macos
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: macos-${{ matrix.arch }}
          path: packages/
      - name: From the disk image, as a user installs it
        run: |
          hdiutil attach -nobrowse -readonly -mountpoint "$RUNNER_TEMP/dmg" packages/sandbox-ai-${{ matrix.arch }}.dmg
          test -L "$RUNNER_TEMP/dmg/Applications"
          cp -R "$RUNNER_TEMP/dmg/sandbox-ai.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          codesign --verify --deep "$RUNNER_TEMP/sandbox-ai.app" || echo "::warning::the ad-hoc signature does not verify"
          scripts/e2e_package.sh macos-app "$RUNNER_TEMP/sandbox-ai.app"

  release:
    needs: [build, e2e-pyz, e2e-appimage, e2e-macos]
    # Only a pushed tag publishes: a manual run (workflow_dispatch), even on a tag, builds and checks only.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1, published 2026-07-20
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          pattern: "{appimage,macos}-*"
          path: packages/
          merge-multiple: true
      - name: SHA256SUMS over every release file
        run: python3 scripts/make_dist.py --sums-only --out dist --add packages/*
      - name: Signed releases are published by the maintainer
        id: signing
        run: |
          if grep -q '^release@sandbox-ai ' sandbox/release-signers 2>/dev/null; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "::notice::sandbox/release-signers lists keys: sign and publish locally (RELEASING.md, Signed releases): gh run download ${{ github.run_id }} -n dist -D dist && gh run download ${{ github.run_id }} -p 'appimage-*' -p 'macos-*' -D packages && python3 scripts/make_dist.py --sums-only --out dist --add packages/*/* --sign KEY && python3 scripts/publish_release.py --source URL dist/*"
          fi
      - name: GitHub release
        if: github.server_url == 'https://github.com' && steps.signing.outputs.signed != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The page says what is new (docs/releases/vX.Y.Z.md), which file is for whom, how to install, start and update.
          python3 scripts/release_notes.py --version "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* --title "sandbox-ai ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/notes.md"
      - name: Gitea/Forgejo release
        if: github.server_url != 'https://github.com' && steps.signing.outputs.signed != '1'
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          python3 scripts/publish_release.py --source "$SOURCE" --token-env RELEASE_TOKEN \
            --notes "$(python3 scripts/release_notes.py --source "$SOURCE")" dist/*

  pypi:
    needs: [build, e2e-pyz, e2e-appimage, e2e-macos]
    if: github.server_url == 'https://github.com' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    # Trusted publishing: register this repository, workflow release.yml and environment "pypi" on PyPI first.
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2, published 2026-10-07
        with:
          name: dist
          path: dist/
      - name: Only the Python package goes to PyPI
        run: mkdir pypi && cp dist/*.whl dist/sandbox_ai-*.tar.gz pypi/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3, published 2026-10-20
        with:
          packages-dir: pypi/
